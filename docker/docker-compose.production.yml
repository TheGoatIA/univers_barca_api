# Variante « lean » (production) : MongoDB + Redis + API derrière le reverse proxy du VPS.
# Variables fournies par --env-file /var/www/univers-barca/.env.production
name: univers-barca-production

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
  # Stack d'observabilité mutualisée (docker-compose.observability.yml), réseau externe
  services:
    external: true
    name: univers_barca_services

services:
  mongodb:
    image: mongo:7-jammy
    container_name: ub-production-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    # Pas d'authentification : le réseau « internal » (internal: true) isole MongoDB, aucun port n'est publié.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1.0" }
        reservations: { memory: 1G }
    networks: [internal]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  redis:
    image: redis:7-alpine
    container_name: ub-production-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
        reservations: { memory: 256M }
    networks: [internal]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thegoatia/univers_barca_api:prod-latest}
    container_name: ub-production-api
    env_file: ${APP_ENV_FILE:-/var/www/univers-barca/.env.production}
    environment:
      NODE_ENV: production
      PM2_INSTANCES: ${PM2_INSTANCES:-2}
      MONGODB_URI: mongodb://mongodb:27017/univers_barca?replicaSet=rs0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:5001:5000" # jamais exposé directement : reverse proxy (Traefik/Nginx/Apache) uniquement
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
        reservations: { memory: 512M }
    networks: [internal, public, services]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }

volumes:
  mongo_data:
  redis_data:
