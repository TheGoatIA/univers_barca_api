global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: univers-barca-api-production
    metrics_path: /metrics
    static_configs: [{ targets: ["ub-production-api:5000"] }]
  - job_name: univers-barca-api-staging
    metrics_path: /metrics
    static_configs: [{ targets: ["ub-staging-api:5000"] }]
